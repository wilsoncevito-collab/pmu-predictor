<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PMU Predictor Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; padding: 1rem; padding-bottom: 4rem; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { background: #1a2a3a; color: white; padding: 1.5rem; border-radius: 12px; margin-bottom: 1.5rem; text-align: center; }
        .header h1 { font-size: 1.5rem; }
        .header p { opacity: 0.8; font-size: 0.9rem; margin-top: 0.3rem; }
        .card { background: white; padding: 1.25rem; border-radius: 12px; margin-bottom: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .card h2 { font-size: 1.1rem; margin-bottom: 0.75rem; color: #1a2a3a; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
        .stat { background: #f8f9fa; padding: 0.75rem; border-radius: 8px; text-align: center; }
        .stat-value { font-size: 1.5rem; font-weight: bold; color: #1a2a3a; }
        .stat-label { font-size: 0.7rem; color: #888; text-transform: uppercase; }
        .btn { padding: 0.75rem 1.5rem; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; font-size: 1rem; }
        .btn-primary { background: #1a2a3a; color: white; }
        .btn-primary:hover { background: #2a4a6a; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-secondary:hover { background: #5a6268; }
        .btn-success { background: #28a745; color: white; }
        .btn-success:hover { background: #218838; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 0.5rem; }
        .prediction-item { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #eee; font-size: 0.9rem; flex-wrap: wrap; }
        .prediction-item:last-child { border-bottom: none; }
        .prob-high { color: #28a745; font-weight: bold; }
        .prob-medium { color: #ffc107; font-weight: bold; }
        .prob-low { color: #dc3545; font-weight: bold; }
        .loading { text-align: center; color: #888; padding: 2rem; }
        .error { color: #dc3545; padding: 1rem; text-align: center; }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .header h1 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏇 PMU Predictor Pro</h1>
            <p>Prédictions basées sur l'IA • Suggestions de paris</p>
        </div>

        <div class="card">
            <div class="stats-grid" id="stats">
                <div class="stat">
                    <div class="stat-value" id="totalRaces">-</div>
                    <div class="stat-label">Courses</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="totalBets">-</div>
                    <div class="stat-label">Paris</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="winRate">-</div>
                    <div class="stat-label">Taux de réussite</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="totalProfit">-</div>
                    <div class="stat-label">Profit (€)</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>📡 Actions</h2>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="importData()">📥 Importer les données</button>
                <button class="btn btn-secondary" onclick="location.reload()">🔄 Rafraîchir</button>
            </div>
        </div>

        <div class="card">
            <h2>🔮 Dernières prédictions</h2>
            <div id="predictions">
                <div class="loading">Chargement...</div>
            </div>
        </div>

        <div class="btn-group" style="margin-top: 0.5rem;">
            <a href="/predictions" style="text-decoration:none; width:100%;">
                <button class="btn btn-primary">🔮 Prédictions</button>
            </a>
            <a href="/predict" style="text-decoration:none; width:100%;">
                <button class="btn btn-success">🤖 IA Prédire</button>
            </a>
        </div>
        <div class="btn-group" style="margin-top: 0.5rem;">
            <a href="/import" style="text-decoration:none; width:100%;">
                <button class="btn btn-secondary">📄 Importer</button>
            </a>
            <a href="/comparison" style="text-decoration:none; width:100%;">
                <button class="btn btn-secondary">📊 Comparaison</button>
            </a>
        </div>
        <div class="btn-group" style="margin-top: 0.5rem;">
            <a href="/save_courses" style="text-decoration:none; width:100%;">
                <button class="btn btn-secondary">💾 Sauvegarder</button>
            </a>
            <a href="/history" style="text-decoration:none; width:100%;">
                <button class="btn btn-secondary">📜 Historique</button>
            </a>
        </div>
        <div class="btn-group" style="margin-top: 0.5rem;">
            <a href="/betting" style="text-decoration:none; width:100%;">
                <button class="btn btn-secondary">💰 Paris</button>
            </a>
        </div>
    </div>

    <script>
        function loadDashboard() {
            fetch('/api/stats')
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('totalRaces').textContent = data.stats.total_races || 0;
                        document.getElementById('totalBets').textContent = data.stats.total_bets || 0;
                        document.getElementById('winRate').textContent = data.stats.win_rate ? data.stats.win_rate.toFixed(1) + '%' : '-';
                        document.getElementById('totalProfit').textContent = data.stats.total_profit ? data.stats.total_profit.toFixed(2) + '€' : '0€';
                    }
                })
                .catch(() => {});

            fetch('/api/predictions/today')
                .then(r => r.json())
                .then(data => {
                    const container = document.getElementById('predictions');
                    if (!data.success || !data.data || !data.data.meetings || Object.keys(data.data.meetings).length === 0) {
                        container.innerHTML = '<div class="error">⚠️ Aucune prédiction disponible.</div>';
                        return;
                    }
                    let html = '';
                    let count = 0;
                    for (const [venue, races] of Object.entries(data.data.meetings)) {
                        for (const [race_name, predictions] of Object.entries(races)) {
                            if (predictions && predictions.length > 0) {
                                const top = predictions[0];
                                html += `<div class="prediction-item">
                                    <span><strong>${venue} ${race_name}</strong></span>
                                    <span>
                                        <strong>${top.name}</strong>
                                        <span class="${top.probability > 70 ? 'prob-high' : top.probability > 50 ? 'prob-medium' : 'prob-low'}">${top.probability}%</span>
                                    </span>
                                </div>`;
                                count++;
                                if (count >= 5) break;
                            }
                        }
                        if (count >= 5) break;
                    }
                    container.innerHTML = html || '<div class="loading">Aucune prédiction disponible</div>';
                })
                .catch(() => {});
        }

        function importData() {
            const container = document.getElementById('predictions');
            container.innerHTML = '<div class="loading">📥 Import en cours...</div>';
            fetch('/api/import', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('✅ ' + data.message);
                        loadDashboard();
                    } else {
                        alert('❌ Erreur: ' + data.error);
                        loadDashboard();
                    }
                })
                .catch(() => {
                    alert('❌ Erreur de connexion');
                    loadDashboard();
                });
        }

        loadDashboard();
        setInterval(loadDashboard, 60000);
    </script>
</body>
</html>
