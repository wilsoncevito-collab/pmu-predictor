<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prédictions - PMU Predictor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: #f0f2f5; padding: 1rem; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { background: #1a2a3a; color: white; padding: 1rem; border-radius: 12px; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.2rem; }
        .back-btn { color: white; text-decoration: none; background: rgba(255,255,255,0.15); padding: 0.3rem 0.8rem; border-radius: 6px; }
        .card { background: white; padding: 1rem; border-radius: 12px; margin-bottom: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .meeting-title { background: #1a2a3a; color: white; padding: 0.5rem 1rem; border-radius: 8px; margin-bottom: 0.5rem; font-weight: bold; }
        .race-title { font-weight: bold; margin: 0.5rem 0; color: #1a2a3a; padding-left: 0.5rem; border-left: 3px solid #1a2a3a; }
        .runner { display: flex; justify-content: space-between; padding: 0.3rem 0; border-bottom: 1px solid #eee; font-size: 0.85rem; flex-wrap: wrap; }
        .runner:last-child { border-bottom: none; }
        .prob-high { color: #28a745; font-weight: bold; }
        .prob-medium { color: #ffc107; font-weight: bold; }
        .prob-low { color: #dc3545; font-weight: bold; }
        .value-positive { color: #28a745; }
        .value-negative { color: #dc3545; }
        .btn { padding: 0.3rem 0.6rem; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 0.7rem; }
        .btn-bet { background: #28a745; color: white; }
        .btn-bet:hover { background: #218838; }
        .loading { text-align: center; color: #888; padding: 2rem; }
        .error { color: #dc3545; padding: 1rem; text-align: center; }
        .suggestion-box { background: #e8f5e9; padding: 0.5rem; border-radius: 8px; margin-top: 0.5rem; border-left: 3px solid #28a745; }
        .date-info { background: #e3f2fd; padding: 0.5rem 1rem; border-radius: 8px; margin-bottom: 1rem; color: #0d47a1; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔮 Prédictions</h1>
            <a href="/" class="back-btn">← Retour</a>
        </div>

        <div id="predictions-container">
            <div class="loading">Chargement...</div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 0.5rem;">
            <button class="btn" style="background:#1a2a3a;color:white;padding:0.75rem;" onclick="loadPredictions()">🔄 Rafraîchir</button>
        </div>
    </div>

    <script>
        function loadPredictions() {
            const container = document.getElementById('predictions-container');
            container.innerHTML = '<div class="loading">Chargement...</div>';
            
            fetch('/api/predictions/today')
                .then(r => r.json())
                .then(data => {
                    console.log('Données reçues:', data);
                    
                    if (!data.success) {
                        container.innerHTML = `<div class="error">❌ ${data.error || 'Erreur'}</div>`;
                        return;
                    }

                    const result = data.data;
                    if (!result || !result.meetings || Object.keys(result.meetings).length === 0) {
                        container.innerHTML = '<div class="error">⚠️ Aucune prédiction disponible</div>';
                        return;
                    }

                    let html = '';
                    
                    if (result.date) {
                        html += `<div class="date-info">📅 ${result.date}</div>`;
                    }

                    for (const [venue, races] of Object.entries(result.meetings)) {
                        html += `<div class="meeting-title">🏟️ Réunion ${venue}</div>`;

                        for (const [race_name, predictions] of Object.entries(races)) {
                            if (!predictions || predictions.length === 0) continue;

                            html += `<div class="card">`;
                            html += `<div class="race-title">${race_name} (${predictions.length} partants)</div>`;

                            // Suggestions (top 3)
                            const top3 = predictions.slice(0, 3);
                            if (top3.length > 0) {
                                html += `<div class="suggestion-box">`;
                                html += `<strong>💡 Suggestions</strong><br>`;
                                top3.forEach(p => {
                                    const valueColor = p.value > 0 ? 'value-positive' : 'value-negative';
                                    const probClass = p.probability > 70 ? 'prob-high' : p.probability > 50 ? 'prob-medium' : 'prob-low';
                                    html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:0.2rem 0;flex-wrap:wrap;font-size:0.85rem;">
                                        <span><strong>${p.name}</strong> (${p.win_odds})</span>
                                        <span>
                                            <span class="${probClass}">${p.probability}%</span>
                                            <span class="${valueColor}">${p.value > 0 ? '+' : ''}${p.value}%</span>
                                            <button class="btn btn-bet" onclick="addBet('${p.name}', ${p.probability}, ${p.win_odds})">💰</button>
                                        </span>
                                    </div>`;
                                });
                                html += `</div>`;
                            }

                            // Liste complète (seulement les 10 premiers pour ne pas surcharger)
                            const top10 = predictions.slice(0, 10);
                            top10.forEach(p => {
                                const probClass = p.probability > 70 ? 'prob-high' : p.probability > 50 ? 'prob-medium' : 'prob-low';
                                const valueClass = p.value > 0 ? 'value-positive' : 'value-negative';
                                html += `<div class="runner">
                                    <span><strong>${p.name}</strong></span>
                                    <span>
                                        <span class="${probClass}">${p.probability}%</span>
                                        <span style="margin-left:0.5rem;">${p.win_odds}</span>
                                        <span class="${valueClass}" style="margin-left:0.5rem;">${p.value > 0 ? '+' : ''}${p.value}%</span>
                                    </span>
                                </div>`;
                            });

                            if (predictions.length > 10) {
                                html += `<div style="text-align:center;color:#888;font-size:0.8rem;padding:0.3rem;">+ ${predictions.length - 10} autres</div>`;
                            }

                            html += `</div>`;
                        }
                    }

                    container.innerHTML = html;
                })
                .catch(err => {
                    console.error('Erreur:', err);
                    container.innerHTML = `<div class="error">❌ Erreur: ${err.message}</div>`;
                });
        }

        function addBet(horse, probability, odds) {
            const stake = prompt(`Mise pour ${horse} (1-5€) :`, '1.0');
            if (stake) {
                fetch('/api/bets', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        horse_name: horse,
                        stake: parseFloat(stake),
                        odds: odds,
                        probability: probability
                    })
                })
                .then(r => r.json())
                .then(data => {
                    alert(data.success ? '✅ Pari enregistré !' : '❌ Erreur');
                    loadPredictions();
                });
            }
        }

        loadPredictions();
    </script>
</body>
</html>
